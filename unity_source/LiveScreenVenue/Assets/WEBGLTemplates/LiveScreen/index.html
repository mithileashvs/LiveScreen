<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Full-bleed layout: no scrollbars, no margins, canvas fills the
         entire iframe so it looks like part of the app, not a separate page. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0f;
        overflow: hidden;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0a0a0f;
        /* Starts invisible so the very first Unity-rendered frame(s) never
           flash unstyled before fading in — this, plus the loading bar's
           fade-out below, turns the load into a crossfade instead of a
           hard pop. */
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #unity-canvas.is-ready {
        opacity: 1;
      }
      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      #unity-loading-bar.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #unity-progress-bar-empty {
        width: 160px;
        height: 4px;
        background: #2a2a35;
        border-radius: 2px;
        margin-top: 12px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #e8b94a;
      }
      #unity-warning {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
      // These macros (three curly braces on each side, filled in below)
      // are replaced by Unity at build time from your actual Player
      // Settings / build output — using them (instead of hardcoded
      // filenames like "unity_source.loader.js") is also what prevents
      // the filename-mismatch bug we hit earlier in this project
      // (index.html referencing stale filenames from a previous build).
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };
      var loadingBar = document.querySelector("#unity-loading-bar");
      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          window.addEventListener('message', function(event) {
            if (typeof event.data === 'string' && window.unityInstance) {
              if (event.data.indexOf('experience_seat:') === 0) {
                var seatId = event.data.split(':')[1];
                window.unityInstance.SendMessage('FlutterBridge', 'ExperienceSeatById', seatId);
              } else if (event.data.indexOf('load_configuration:') === 0) {
                // Everything after the first colon is the JSON payload —
                // split(':')[1] alone would truncate it at the first colon
                // INSIDE the JSON itself (e.g. {"roomWidth":20}), so this
                // takes everything after the "load_configuration:" prefix.
                var json = event.data.substring('load_configuration:'.length);
                window.unityInstance.SendMessage('FlutterBridge', 'LoadConfiguration', json);
              }
            }
          });
          // Crossfade: loading bar fades out while the canvas fades in, at
          // the same time, instead of one instantly disappearing and the
          // other instantly appearing.
          loadingBar.classList.add('is-hidden');
          canvas.classList.add('is-ready');
          // Fully remove the loading bar from layout only after its fade
          // finishes, so it can't block clicks while invisible.
          setTimeout(() => {
            loadingBar.style.display = "none";
          }, 500);
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
