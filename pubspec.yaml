name: livescreen
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Persistent backend (PART: shared database connecting Producer / Theatre
  # Admin / User). Added because the project had no backend/database of any
  # kind before this — confirmed by inspecting this file prior to editing.
  supabase_flutter: ^2.17.2

  # Loads SUPABASE_URL / SUPABASE_ANON_KEY from a local .env file instead of
  # hardcoding them into source (see .env.example and SUPABASE_SETUP.md).
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # .env is loaded as an asset so flutter_dotenv can read it at runtime.
  # The real .env is gitignored — only .env.example is committed.
  assets:
    - .env
